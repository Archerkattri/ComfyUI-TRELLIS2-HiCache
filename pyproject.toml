# Packaging metadata for the registry.comfy.org Comfy Registry.
# Field layout follows https://docs.comfy.org/registry/specifications

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-trellis2-hicache"
description = "Training-free TRELLIS.2 acceleration using HiCache Hermite / HiCache++ DMD (hicache-pp). Insert between the TRELLIS2 loader and sampler. Earlier RTX 5090 README result (1.9x) is a setup-specific historical measurement, not a current-release guarantee; see README for metrics and limits."
version = "0.1.5"
keywords = ["comfyui", "diffusion-acceleration", "caching", "training-free", "trellis2", "image-to-3d"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["hicache-pp>=1.2.1"]
classifiers = ["Development Status :: 4 - Beta"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24", "torch>=2.1", "ruff>=0.16"]

[project.urls]
Repository = "https://github.com/Archerkattri/ComfyUI-TRELLIS2-HiCache"
BugTracker = "https://github.com/Archerkattri/ComfyUI-TRELLIS2-HiCache/issues"

[tool.comfy]
PublisherId = "archerkattri"
DisplayName = "ComfyUI-TRELLIS2-HiCache"
Icon = "https://raw.githubusercontent.com/Archerkattri/ComfyUI-TRELLIS2-HiCache/master/icon.png"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = ["trellis_hicache_patch", "nodes"]
