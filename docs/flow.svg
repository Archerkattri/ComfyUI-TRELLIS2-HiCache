<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">TRELLIS.2 HiCache stage boundary</title>
  <desc id="desc">Acceleration is confined to supported shape stages; optional texture remains explicit and separately reported.</desc>
  <rect width="1200" height="420" rx="22" fill="#020617"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>.t{font-family:Inter,Segoe UI,sans-serif;fill:#f8fafc}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.muted{fill:#94a3b8}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:6 5}.box{fill:#111827;stroke:#334155;stroke-width:1.5}</style>
  </defs>
  <text class="t" x="38" y="46" font-size="25" font-weight="700">TRELLIS.2 HiCache stage boundary</text>
  <text class="t muted" x="38" y="72" font-size="14">Acceleration is confined to supported shape stages; optional texture remains explicit and separately reported.</text>
  <g transform="translate(28 184)"><rect class="box" width="132" height="70" rx="12" stroke="#a78bfa"/><text class="t" x="66" y="30" text-anchor="middle" font-size="14" font-weight="700">Image</text><text class="m muted" x="66" y="53" text-anchor="middle" font-size="11">conditioning</text></g>
  <path class="line" d="M160 219L205 219"/>
  <g transform="translate(205 145)"><rect class="box" width="220" height="148" rx="12" stroke="#8b5cf6"/><text class="t" x="110" y="69" text-anchor="middle" font-size="14" font-weight="700">Sparse structure</text><text class="m muted" x="110" y="92" text-anchor="middle" font-size="11">own cache + schedule</text></g>
  <text class="m" x="315" y="234" text-anchor="middle" font-size="11">compute ↔ forecast ↔ fallback</text>
  <path class="line" d="M425 219L475 219"/>
  <g transform="translate(475 145)"><rect class="box" width="220" height="148" rx="12" stroke="#8b5cf6"/><text class="t" x="110" y="69" text-anchor="middle" font-size="14" font-weight="700">Shape SLaT</text><text class="m muted" x="110" y="92" text-anchor="middle" font-size="11">own cache + schedule</text></g>
  <text class="m" x="585" y="234" text-anchor="middle" font-size="11">compute ↔ forecast ↔ fallback</text>
  <path class="line" d="M695 219L745 219"/>
  <g transform="translate(745 166)"><rect class="box" width="165" height="106" rx="12" stroke="#38bdf8"/><text class="t" x="82.5" y="48" text-anchor="middle" font-size="14" font-weight="700">Mesh</text><text class="m muted" x="82.5" y="71" text-anchor="middle" font-size="11">shape output</text></g>
  <path class="line" d="M910 219L955 219"/>
  <g transform="translate(955 145)"><rect class="box" width="210" height="148" rx="12" stroke="#f59e0b"/><text class="t" x="105" y="69" text-anchor="middle" font-size="14" font-weight="700">Optional texture</text><text class="m muted" x="105" y="92" text-anchor="middle" font-size="11">outside cache boundary</text></g>
  <path class="dash" d="M205 320H695"/><text class="m" x="450" y="350" text-anchor="middle" font-size="11">identity-bound state; no cross-stage or cross-run reuse</text>
  <path class="dash" d="M745 320H1165"/><text class="m" x="955" y="350" text-anchor="middle" font-size="11">shape and texture timing reported separately</text>
</svg>
